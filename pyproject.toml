[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenese-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["openai>=2,<3", "pydantic>=2,<3", "tiktoken>=0.7", "streamlit>=1.64,<2", "llmlingua>=0.2", "python-dotenv>=1"]

[project.optional-dependencies]
test = ["pytest>=8"]
bear = ["the-token-company>=0.5"]

[tool.setuptools.packages.find]
include = ["tokenese*"]
