[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "token-language"
version = "0.1.0"
description = "Token-efficient English-Mandarin hybrid language for reducing LLM input cost"
requires-python = ">=3.11"
dependencies = [
    "tokenizers>=0.20",
    "tiktoken>=0.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "requests>=2.31",
    "regex>=2024.0",
    "tqdm>=4.66",
    "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
# Local multilingual embeddings for semantic equivalence. Heavy (~2GB with LaBSE).
semantics = ["sentence-transformers>=3.0", "torch>=2.2", "numpy>=1.26"]
# Charts + tabular analysis for the experiment report.
report = ["pandas>=2.2", "matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
